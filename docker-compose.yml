services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dws}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dws_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dws}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dws} -d ${POSTGRES_DB:-dws}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dws}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dws_secret}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dws}:${POSTGRES_PASSWORD:-dws_secret}@postgres:5432/${POSTGRES_DB:-dws}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-dws}:${RABBITMQ_PASSWORD:-dws_secret}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FILES_STORAGE_PATH: /data/files
    volumes:
      - files_data:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    expose:
      - "8000"
    networks:
      - internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dws}:${POSTGRES_PASSWORD:-dws_secret}@postgres:5432/${POSTGRES_DB:-dws}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-dws}:${RABBITMQ_PASSWORD:-dws_secret}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FILES_STORAGE_PATH: /data/files
    volumes:
      - files_data:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME | grep -q OK",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  postgres_data:
  files_data:

networks:
  internal:
    driver: bridge
